<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1, shrik-to-fit = no">
    <link rel="stylesheet" href="../style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            lucide.createIcons();
        })
    </script>
    <title>Cardápio</title>
</head>
<body>
<navbar>
    <img th:src="@{/imagens/info.png}">
        <a th:href="@{/cardapio}"> Cadastro de Pratos</a>

</navbar>
<container>
        <form action="#" th:action="@{/cardapio/salvar}" th:object="${cardapio}" method="POST">
            <input type="hidden" th:field="*{id}"/>
            <label class="lead">Nome do Prato</label>
            <input type="text" th:field="*{prato}" class="form-control mb-4 w-25">
            <label class="lead">Descrição</label>
            <input type="text" th:field="*{descricao}" class="form-control mb-4 w-50">
            <label class="lead">Preço</label>
            <input type="text" th:field="*{preco}" min="0" step="0.01" class="form-control mb-4 w-25">
            <botoes>
            <button type="submit" class="save"><i data-lucide="circle-check"></i>Salvar</button>
            <a th:href="@{/cardapio}"><i data-lucide="circle-x"></i>Cancelar</a>
            </botoes>
        </form>
    </container>
</body>
</html>
